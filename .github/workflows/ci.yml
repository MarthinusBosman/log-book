# Checks every push and pull request: typecheck, unit tests, both production builds, the shell
# scripts, a Docker build + smoke test, and (separate job) the Playwright end-to-end suite.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tags are handled by docker.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4"

jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build:bun
      - run: bun run build:cf
      - name: shellcheck
        run: shellcheck scripts/install.sh scripts/docker-smoke.sh

  docker:
    name: Docker build + smoke test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: log-book:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/docker-smoke.sh log-book:ci
      - name: Compose file resolves for every profile
        run: |
          cp .env.example .env
          for p in "" https tunnel lan lan-http; do
            docker compose ${p:+--profile "$p"} config --quiet
          done

  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
